name: Collect Materials

# Workshops, courses, and one-off projects are intentionally kept out of the
# nightly ecosystem pass. Refresh their lightweight metadata once a week or on
# demand without running health, registry, CI, or feature-adoption checks.

on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mission-control-materials
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install PyYAML packaging

      - name: Collect lightweight material metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m collector --root . --materials

      - name: Commit material metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/materials.json
          if git diff --quiet --cached; then
            echo "No material changes to commit."
          else
            git commit -m "chore: material snapshot $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
