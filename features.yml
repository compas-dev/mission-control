# Features / APIs tracked for adoption across the ecosystem.
# Each entry is a column in the adoption matrix. See SPEC.md §4.2 and §5.4.
#
# detection kinds:
#   pin     - inspect a dependency version specifier (from requirements.txt)
#   python  - is a Python version in the resolved support list?
#   file    - does any of the given paths exist in the repo?
#   code    - GitHub code search for present/absent patterns
#   manual  - status comes from repos.yml `feature_overrides`

features:
  - id: compas2
    label: "On COMPAS 2.x"
    kind: pin
    applies_to: [python]
    detect:
      package: compas
      satisfied_by: ">=2,<3"

  - id: py311
    label: "Python 3.11"
    kind: python
    applies_to: [python]
    detect:
      version: "3.11"

  - id: py312
    label: "Python 3.12"
    kind: python
    applies_to: [python]
    detect:
      version: "3.12"

  - id: py313
    label: "Python 3.13"
    kind: python
    applies_to: [python]
    detect:
      version: "3.13"

  - id: new-scene-api
    label: "New Scene API"
    kind: code
    applies_to: [python]
    detect:
      # Deprecated Artist usage means the migration is incomplete, even if
      # compas.scene is also present. Repos using neither API are likely non-UI
      # extensions, so exclude them from this feature's adoption percentage.
      language: Python
      present:
        - "from compas.scene"
        - "import compas.scene"
        - "from compas import scene"
        - "compas.scene."
      absent:
        - "from compas.artists"
        - "import compas.artists"
        - "from compas import artists"
        - "compas.artists."
      no_match: n/a

  - id: no-deprecated-artist
    label: "No deprecated Artist"
    kind: code
    applies_to: [python]
    detect:
      # Restrict this to Python so changelogs/docs discussing the old API do
      # not count as live usage.
      language: Python
      absent:
        - "from compas.artists"
        - "import compas.artists"
        - "from compas import artists"

  # Migrated TO MkDocs and AWAY from Sphinx: mkdocs.yml present, no sphinx conf.py.
  - id: mkdocs
    label: "MkDocs (not Sphinx)"
    kind: file
    applies_to: [python]
    detect:
      any_of:
        - "mkdocs.yml"
      none_of:
        - "docs/conf.py"
        - "docs/source/conf.py"

  - id: invocations2
    label: "Uses compas_invocations2"
    kind: code
    applies_to: [python]
    detect:
      language: Python
      present:
        - "compas_invocations2"

  - id: compas-actions
    label: "Uses compas-actions"
    kind: code
    applies_to: [python]
    detect:
      # The unified action repository exposes individual actions as subpaths.
      # Legacy repositories used names such as compas-actions.build and
      # compas-actions.publish.
      language: YAML
      present:
        - "compas-dev/compas-actions/"
      absent:
        - "compas-dev/compas-actions."

  # -- deployment / release checks --------------------------------------
  - id: pypi-match
    label: "Registry = GitHub release"
    kind: registry-match

  - id: conda-forge
    label: "On conda-forge"
    kind: conda
    applies_to: [python]
